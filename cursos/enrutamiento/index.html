<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cisco Config Generator</title>
  <style>
    :root {
      --deep-water: #286f70;
      --lagoon: #43aaa4;
      --aqua: #72d3c5;
      --mint: #b8e6cf;
      --ivory: #f5f7d8;
      --ink: #173f42;
      --surface: rgba(245, 247, 216, 0.94);
    }
    * { box-sizing: border-box; }
    body {
      max-width: 900px;
      margin: 30px auto;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, var(--aqua), var(--lagoon));
      min-height: calc(100vh - 60px);
      border: 1px solid rgba(245, 247, 216, 0.55);
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(23, 63, 66, 0.25);
    }
    html { background: var(--deep-water); }
    h1 { margin-top: 0; font-size: 1.7rem; color: var(--ivory); text-shadow: 0 1px 2px rgba(23, 63, 66, 0.35); }
    h2 { margin: 28px 0 4px; font-size: 1rem; letter-spacing: 0.08em; color: var(--ivory); }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    textarea, input {
      width: 100%;
      padding: 11px;
      font: 14px/1.4 monospace;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid rgba(40, 111, 112, 0.55);
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea:focus, input:focus { border-color: var(--deep-water); box-shadow: 0 0 0 3px rgba(245, 247, 216, 0.35); }
    #result { background: #edf4d5; }
    #template, #result { min-height: 260px; }
    .block-input { min-height: 130px; }
    button {
      margin-top: 12px;
      padding: 10px 18px;
      color: var(--ivory);
      font-weight: bold;
      background: var(--deep-water);
      border: 1px solid rgba(245, 247, 216, 0.6);
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: #1f5b5d; }
    button:active { transform: translateY(1px); }
    #variables:empty::after { content: "Carga la plantilla para generar los campos."; display: block; color: var(--ink); margin-top: 10px; }
    #copy { float: right; }
    @media (max-width: 600px) {
      body { margin: 0; min-height: 100vh; border-radius: 0; padding: 18px; }
    }
  </style>
</head>
<body>
  <h1>Cisco Config Generator</h1>

  <label for="template">TEMPLATE</label>
  <textarea id="template" spellcheck="false">hostname {{HOSTNAME}}
ip domain-name {{DOMAIN}}

interface Loopback0
 ip address {{ROUTER_ID}} 255.255.255.255

interface GigabitEthernet0/0
 description LAN
 ip address {{PREFIX}}.1 255.255.255.0
 no shutdown

{{BLOCK:VLANS}}

router ospf 1
 router-id {{ROUTER_ID}}
 network {{PREFIX}}.0 0.0.0.255 area 0</textarea>
  <button id="load" type="button">Load Template</button>

  <h2>VARIABLES</h2>
  <div id="variables"></div>

  <h2>RESULT</h2>
  <textarea id="result" readonly spellcheck="false"></textarea>
  <button id="copy" type="button">Copy</button>

  <script>
    const template = document.querySelector('#template');
    const variables = document.querySelector('#variables');
    const result = document.querySelector('#result');
    const loadButton = document.querySelector('#load');
    const copyButton = document.querySelector('#copy');
    const values = new Map();

    function findVariables(text) {
      const found = [];
      const seen = new Set();
      const pattern = /{{\s*(?:(BLOCK)\s*:\s*)?([A-Za-z_][A-Za-z0-9_]*)\s*}}/g;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        const item = { name: match[2], block: Boolean(match[1]) };
        if (!seen.has(item.name)) {
          seen.add(item.name);
          found.push(item);
        }
      }
      return found;
    }

    function render() {
      result.value = template.value.replace(
        /{{\s*(?:(BLOCK)\s*:\s*)?([A-Za-z_][A-Za-z0-9_]*)\s*}}/g,
        (_, block, name) => values.get(name) || ''
      );
    }

    function loadTemplate() {
      const previousValues = new Map(values);
      values.clear();
      variables.replaceChildren();

      for (const item of findVariables(template.value)) {
        const label = document.createElement('label');
        label.htmlFor = `variable-${item.name}`;
        label.textContent = item.name;

        const field = document.createElement(item.block ? 'textarea' : 'input');
        field.id = `variable-${item.name}`;
        field.dataset.variable = item.name;
        field.spellcheck = false;
        if (item.block) field.className = 'block-input';
        field.value = previousValues.get(item.name) || '';
        values.set(item.name, field.value);

        field.addEventListener('input', () => {
          values.set(item.name, field.value);
          render();
        });

        variables.append(label, field);
      }
      render();
    }

    loadButton.addEventListener('click', loadTemplate);

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.value);
      } catch (_) {
        result.select();
        document.execCommand('copy');
      }
      copyButton.textContent = 'Copied!';
      setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
    });

    loadTemplate();
  </script>
</body>
</html>
