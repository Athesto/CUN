<!doctype html>
<html lang="es" data-theme="galaxy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cisco Config Generator</title>
  <style>
    :root {
      --page: #1d2036;
      --panel-a: #343858;
      --panel-b: #4a4165;
      --accent: #7774a8;
      --accent-hover: #625f92;
      --highlight: #ddd0a8;
      --code-text: #514d7b;
      --text: #f3eff7;
      --muted: #d2cbe0;
      --field: #e6e1ef;
      --field-text: #292a40;
      --border: #aaa1c1;
      --shadow: rgba(13, 14, 28, 0.38);
      --button-text: #ffffff;
      --label-bg: #78738e;
      --label-text: #f1edf5;
      --glow-one: rgba(122, 127, 190, 0.24);
      --glow-two: rgba(207, 170, 116, 0.13);
    }
    :root[data-theme="ocean"] {
      --page: #29494b; --panel-a: #527979; --panel-b: #668b82;
      --accent: #426b6c; --accent-hover: #355a5b; --highlight: #f0e6bd; --code-text: #315859;
      --text: #f5f1dc; --muted: #e0e3cf; --field: #e8ead8;
      --field-text: #213d3e; --border: #9bafa1; --shadow: rgba(20, 42, 42, 0.32); --button-text: #ffffff;
      --label-bg: #628b86; --label-text: #f0f3dc; --glow-one: rgba(151, 207, 190, 0.22); --glow-two: rgba(229, 217, 158, 0.12);
    }
    :root[data-theme="light"] {
      --page: #e8edf3; --panel-a: #ffffff; --panel-b: #e7eef7;
      --accent: #1769aa; --accent-hover: #0d4f86; --highlight: #1769aa; --code-text: #15598e;
      --text: #1e2936; --muted: #566576; --field: #ffffff;
      --field-text: #17202a; --border: #9dafc1; --shadow: rgba(29, 45, 61, 0.18); --button-text: #ffffff;
      --label-bg: #74879a; --label-text: #ffffff; --glow-one: rgba(98, 143, 184, 0.12); --glow-two: rgba(221, 184, 105, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      max-width: 900px;
      margin: 30px auto;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 82% 8%, var(--glow-two), transparent 28%),
        radial-gradient(circle at 8% 32%, var(--glow-one), transparent 34%),
        linear-gradient(145deg, var(--panel-a), var(--panel-b));
      min-height: calc(100vh - 60px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 45px var(--shadow);
    }
    html { background: var(--page); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    h1 { margin: 0; font-size: 1.7rem; color: var(--text); text-shadow: 0 1px 2px var(--shadow); }
    h2 { margin: 28px 0 4px; font-size: 1rem; letter-spacing: 0.08em; color: var(--text); }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    .theme-picker label { display: inline; margin: 0 6px 0 0; font-size: 0.85rem; }
    select { padding: 8px; color: var(--field-text); background: var(--field); border: 1px solid var(--border); border-radius: 7px; }
    .syntax-help { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 8px 0 10px; color: var(--muted); font-size: 0.86rem; }
    .syntax-help span { display: flex; align-items: center; gap: 7px; }
    code {
      padding: 3px 8px;
      color: var(--label-text);
      background: var(--label-bg);
      border: 0;
      border-radius: 999px;
      font-weight: bold;
      opacity: 0.88;
    }
    textarea, input {
      width: 100%;
      padding: 11px;
      font: 14px/1.4 monospace;
      color: var(--field-text);
      background: var(--field);
      border: 2px solid var(--border);
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    #template, #result { min-height: 260px; }
    .block-input { min-height: 130px; }
    button {
      margin-top: 12px;
      padding: 10px 18px;
      color: var(--button-text);
      font-weight: bold;
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    #variables:empty::after { content: "Carga la plantilla para generar los campos."; display: block; color: var(--muted); margin-top: 10px; }
    #copy { float: right; }
    @media (max-width: 600px) {
      body { margin: 0; min-height: 100vh; border-radius: 0; padding: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Cisco Config Generator</h1>
    <div class="theme-picker">
      <label for="theme">Tema</label>
      <select id="theme">
        <option value="galaxy">Ciudad galáctica</option>
        <option value="ocean">Agua turquesa</option>
        <option value="light">Claro</option>
      </select>
    </div>
  </div>

  <label for="template">TEMPLATE</label>
  <div class="syntax-help">
    <span><code>{{VARIABLE}}</code> campo vacío</span>
    <span><code>{{VARIABLE=valor}}</code> con valor inicial</span>
    <span><code>{{BLOCK:VARIABLE}}</code> varias líneas</span>
  </div>
  <textarea id="template" spellcheck="false">hostname {{HOSTNAME=R1-BOGOTA}}
ip domain-name {{DOMAIN=empresa.local}}

interface Loopback0
 ip address {{ROUTER_ID=1.1.1.1}} 255.255.255.255

interface GigabitEthernet0/0
 description LAN
 ip address {{PREFIX=192.168.10}}.1 255.255.255.0
 no shutdown

{{BLOCK:VLANS}}

router ospf 1
 router-id {{ROUTER_ID}}
 network {{PREFIX}}.0 0.0.0.255 area 0</textarea>
  <button id="load" type="button">Load Template</button>

  <h2>VARIABLES</h2>
  <div id="variables"></div>

  <h2>RESULT</h2>
  <textarea id="result" readonly spellcheck="false"></textarea>
  <button id="copy" type="button">Copy</button>

  <script>
    const template = document.querySelector('#template');
    const variables = document.querySelector('#variables');
    const result = document.querySelector('#result');
    const loadButton = document.querySelector('#load');
    const copyButton = document.querySelector('#copy');
    const themePicker = document.querySelector('#theme');
    const values = new Map();

    const savedTheme = localStorage.getItem('cisco-config-theme');
    if (savedTheme && [...themePicker.options].some(option => option.value === savedTheme)) {
      themePicker.value = savedTheme;
      document.documentElement.dataset.theme = savedTheme;
    }

    themePicker.addEventListener('change', () => {
      document.documentElement.dataset.theme = themePicker.value;
      localStorage.setItem('cisco-config-theme', themePicker.value);
    });

    function findVariables(text) {
      const found = [];
      const seen = new Set();
      const pattern = /{{\s*(?:(BLOCK)\s*:\s*)?([A-Za-z_][A-Za-z0-9_]*)(?:\s*=\s*([^{}]*?))?\s*}}/g;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        const item = {
          name: match[2],
          block: Boolean(match[1]),
          defaultValue: match[3] === undefined ? '' : match[3].trim()
        };
        if (!seen.has(item.name)) {
          seen.add(item.name);
          found.push(item);
        }
      }
      return found;
    }

    function render() {
      result.value = template.value.replace(
        /{{\s*(?:(BLOCK)\s*:\s*)?([A-Za-z_][A-Za-z0-9_]*)(?:\s*=\s*([^{}]*?))?\s*}}/g,
        (_, block, name) => values.get(name) || ''
      );
    }

    function loadTemplate() {
      const previousValues = new Map(values);
      values.clear();
      variables.replaceChildren();

      for (const item of findVariables(template.value)) {
        const label = document.createElement('label');
        label.htmlFor = `variable-${item.name}`;
        label.textContent = item.name;

        const field = document.createElement(item.block ? 'textarea' : 'input');
        field.id = `variable-${item.name}`;
        field.dataset.variable = item.name;
        field.spellcheck = false;
        if (item.block) field.className = 'block-input';
        field.value = previousValues.has(item.name)
          ? previousValues.get(item.name)
          : item.defaultValue;
        values.set(item.name, field.value);

        field.addEventListener('input', () => {
          values.set(item.name, field.value);
          render();
        });

        variables.append(label, field);
      }
      render();
    }

    loadButton.addEventListener('click', loadTemplate);

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.value);
      } catch (_) {
        result.select();
        document.execCommand('copy');
      }
      copyButton.textContent = 'Copied!';
      setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
    });

    loadTemplate();
  </script>
</body>
</html>
