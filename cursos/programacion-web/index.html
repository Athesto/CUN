<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cuestionario de repaso de Programación Web">
  <title>Cuestionario de Programación Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="quiz" aria-labelledby="page-title">
    <header class="quiz__header">
      <p class="eyebrow">Programación Web · CUN</p>
      <h1 id="page-title">Cuestionario de repaso</h1>
      <p class="intro">Pon a prueba tus conocimientos de HTML, formularios, CSS y JavaScript.</p>
    </header>

    <section id="loading" class="panel status" aria-live="polite">Cargando preguntas…</section>

    <section id="quiz-panel" class="panel" hidden>
      <div class="progress-row">
        <span id="progress-text">Pregunta 1 de 1</span>
        <span id="score-text">Aciertos: 0</span>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

      <h2 id="question-text"></h2>
      <form id="answer-form">
        <fieldset id="options" aria-labelledby="question-text"></fieldset>
        <button id="check-button" type="submit">Comprobar respuesta</button>
      </form>

      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden>
        <h3 id="feedback-title"></h3>
        <p id="explanation"></p>
        <p class="source">Fuente: <strong id="source"></strong></p>
      </div>

      <button id="next-button" class="button-secondary" type="button" hidden>Siguiente pregunta</button>
    </section>

    <section id="result-panel" class="panel result" aria-live="polite" hidden>
      <p class="eyebrow">Resultado final</p>
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <button id="restart-button" type="button">Intentar de nuevo</button>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
